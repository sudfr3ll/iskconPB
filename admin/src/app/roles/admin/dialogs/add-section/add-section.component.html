<h1 mat-dialog-title>Add Section</h1>
<div mat-dialog-content>
    <form class="example-form">

        <mat-form-field class="example-full-width" appearance="fill">
            <mat-label>Name</mat-label>
            <input matInput [(ngModel)]="section.name" name="name" ngModel placeholder="Name">
        </mat-form-field>

        <!-- <p>{{data.section[0].name}}</p> -->

        <label id="example-radio-group-label">Pick Section Type :</label>
        <mat-radio-group aria-labelledby="example-radio-group-label" class="example-radio-group" ngDefaultControl [ngModelOptions]="{standalone: true}" [(ngModel)]="selectedType">
            <mat-radio-button (change)="radioButtonChange($event)" class="example-radio-button" *ngFor="let type of types" [value]="type">
                {{type}}
            </mat-radio-button>
        </mat-radio-group>
    </form>
</div>
<div mat-dialog-actions style="display: flex;justify-content: flex-end;gap: 6px;">
    <button mat-button (click)="close()">Cancel</button>
    <button mat-button cdkFocusInitial (click)="onClickSave()">Save</button>
</div>

<div *ngIf="showLoader" class="spinnerContainer">
    <div class="absoluteSpinner"></div>
    <sa-spinner-round-filled color="#7366FF" id="loader"></sa-spinner-round-filled>
</div>
