<div mat-dialog-content>

    <div class="img-section">
      <div class="uploadBtnContainer">
        <div class="coverImage">Image</div>
        <div class="upload-btn">
          <mat-icon class="uploadIcon">cloud_upload</mat-icon>
          <input accept="image/x-png,image/gif,image/jpeg" type="file" multiple (change)="sendImageEvent($event)">
        </div>
      </div>
      <div *ngIf="imagesArr" class="image__container">
        <div class="container_main" *ngFor="let image of imagesArr; let i = index">
          <ng-container *ngIf="image.org">
              <div class="imageUpload">
                <div (click)="removeImage(i)" class="cross_container">
                  <span class="crossIcon"><mat-icon>cancel</mat-icon></span>
                </div>
                <img [src]="image.org">
              </div>
          </ng-container>
        </div>
      </div>

      
      <div *ngIf="picture.image.org" class="imageUpload">
        <div (click)="removeSingleImage()" class="cross_container">
          <span class="crossIcon"><mat-icon>cancel</mat-icon></span>
        </div>
        <img [src]="picture.image.org">
      </div>
     

    </div>
    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Title</mat-label>
      <input matInput placeholder="Title" name="title" [(ngModel)]="picture.title">
    </mat-form-field>
<!-- 
    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Description</mat-label>
      <input matInput placeholder="Description" name="description" [(ngModel)]="picture.description">
    </mat-form-field> -->

    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Category Level 1</mat-label>
      <mat-select  [(ngModel)]="categoryOneId" (selectionChange)="changeCategoryOneName($event)" name="categoryOne">
        <mat-option *ngFor="let categoryOne of categoryOnePictureData" [value]="categoryOne.id">
          {{categoryOne.name}}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Category Level 2</mat-label>
      <mat-select [disabled]="categoryTwoPictureData.length == 0"  [(ngModel)]="categoryTwoId" (selectionChange)="changeCategoryTwoName($event)" name="categoryTwo">
        <mat-option *ngFor="let categoryTwo of categoryTwoPictureData" [value]="categoryTwo.id">
          {{categoryTwo.name}}
        </mat-option>
      </mat-select>
    </mat-form-field>

      <mat-form-field class="example-full-width" appearance="fill">
        <mat-label>Category Level 3</mat-label>
        <mat-select [disabled]="categoryThreePictureData.length == 0" [(ngModel)]="categoryThreeId" (selectionChange)="changeCategoryThreeName($event)" name="categoryThree">
          <mat-option *ngFor="let categoryThree of categoryThreePictureData" [value]="categoryThree.id">
            {{categoryThree.name}}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill" class="example-full-width">
        <mat-label>Search keywords</mat-label>
        <input matInput [(ngModel)]="keyword" placeholder="New keyword..." [ngModelOptions]="{standalone: true}" />
        <button mat-stroked-button (click)="addKeyword()" matSuffix [disabled]="!keyword.length">Add</button>
      </mat-form-field>
      <mat-chip-list>
        <mat-chip *ngFor="let keywordItem of picture.keywords" (removed)="removeKeyword(keywordItem)">
          {{keywordItem}}
          <button matChipRemove>
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip>
      </mat-chip-list>

  </form>
</div>
<div mat-dialog-actions style="display: flex;justify-content: flex-end;gap: 6px;">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button cdkFocusInitial [disabled]="!(categoryTwoId) && !(categoryOneId) && !(categoryThreeId)"  (click)="saveEvent($event)">Save</button>
</div>

<div *ngIf="showLoader" class="spinnerContainer">
  <div class="absoluteSpinner"></div>
  <sa-spinner-round-filled color="#7366FF" id="loader"></sa-spinner-round-filled>
</div>
