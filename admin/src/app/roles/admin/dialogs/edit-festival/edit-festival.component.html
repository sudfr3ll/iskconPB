<h1 mat-dialog-title>Festival</h1>
<div mat-dialog-content>
  <form class="example-form">
    <!-- <p>{{date | date: 'dd/MM/yyyy'}}</p> -->
    <div class="img-section">
      <div class="uploadBtnContainer">
        <div class="coverImage">Image</div>
        <div class="upload-btn">
          <mat-icon class="uploadIcon">cloud_upload</mat-icon>
          <input accept="image/x-png,image/gif,image/jpeg" type="file" (change)="sendImageEvent($event)">
        </div>
      </div>

      <div *ngIf="festival.coverImage" class="imageUpload">
        <div (click)="removeImage()" class="cross_container">
          <span class="crossIcon"><mat-icon>cancel</mat-icon></span>
        </div>
        <img [src]="festival.coverImage">
      </div>
    </div>
    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Name</mat-label>
      <input matInput placeholder="Author" name="author" [(ngModel)]="festival.title">
    </mat-form-field>
    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Description</mat-label>
      <input matInput placeholder="Content" name="content" [(ngModel)]="festival.content">
    </mat-form-field>

    <!-- <mat-form-field>
  <mat-label>Festival Date</mat-label>
  <input matInput [matDatepicker]="dob" [(ngModel)]="festival.date" [ngModelOptions]="{standalone: true}">
  <mat-datepicker-toggle matSuffix [for]="dob"></mat-datepicker-toggle>
  <mat-datepicker #dob></mat-datepicker>
</mat-form-field> -->


    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Festival date</mat-label>
      <input style="width: 90%;" matInput [matDatepicker]="dob" disabled [(ngModel)]="festival.date" [ngModelOptions]="{standalone: true}">
      <mat-datepicker-toggle matIconSuffix [for]="dob"></mat-datepicker-toggle>
      <mat-datepicker #dob disabled="false"></mat-datepicker>
    </mat-form-field>




  </form>
</div>
<div mat-dialog-actions style="display: flex;justify-content: flex-end;gap: 6px;">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button cdkFocusInitial (click)="saveFestival($event)">Save</button>
</div>



<div *ngIf="showLoader" class="spinnerContainer">
  <div class="absoluteSpinner"></div>
  <sa-spinner-round-filled color="#7366FF" id="loader"></sa-spinner-round-filled>
</div>
