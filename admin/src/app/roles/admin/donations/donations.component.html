<div class="container-fluid base-inputs">
  <div class="row">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-header">
          <h5>Donations</h5>
        </div>

        <div class="search_box">
          <div><b>Filter:</b> </div>
          <input class="dateType" type="date" [(ngModel)]="startDate">
          <input class="dateType" type="date" [(ngModel)]="endDate">
          <button (click)="search(convertToDate(startDate), convertToDate(endDate))">Search</button>
        </div>

      
        

        <form class="form theme-form" *ngIf="donations">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">S.No.</th>
                <th scope="col">createdAt</th>
                <th scope="col">Donation name</th>
                <th scope="col">Amount</th>
                <th scope="col">Payment Status</th>
                <th scope="col">Payment Mode</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let donation of donations; let i = index;">
                <td>{{i + 1}}</td>
                <td>{{formatDate(donation?.createdAt)}}</td>
                <td>{{donation?.donation?.name}}</td>
                <td>{{donation?.amount}}</td>
                <td
                  [ngClass]="{ 'green': donation.payment?.status =='completed', 'yellow': donation.payment?.status =='pending','grey': donation.payment?.status =='cancelled', 'red': donation.payment?.status =='failed' }">
                  {{donation?.payment?.status}}</td>

                  <td>{{donation?.payment.mode || 'N/A'}}</td>

                <td>
                  <mat-icon class="edit-btn" (click)="viewDonation(donation)">visibility</mat-icon>
                </td>
              </tr>
            </tbody>
          </table>
        </form>
        <div class="card-footer">
        </div>
      </div>
    </div>
  </div>
</div>
